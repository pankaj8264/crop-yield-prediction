<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports | Crop AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #020617;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #0F172A;
            padding: 30px;
        }

        .main {
            margin-left: 260px;
            padding: 40px;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2 class="text-white text-center mb-5">
        🌾 Crop AI
    </h2>

    <ul class="nav flex-column">

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html" class="nav-link text-light">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html" class="nav-link text-light">
                <i class="bi bi-graph-up-arrow"></i>
                Predict Crop
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html" class="nav-link text-light">
                <i class="bi bi-clock-history"></i>
                Prediction History
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="reports.html" class="nav-link text-light">
                <i class="bi bi-file-earmark-text"></i>
                Reports
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html" class="nav-link text-light">
                <i class="bi bi-person-circle"></i>
                Profile
            </a>
        </li>

        <li class="nav-item mt-5">
            <a href="#" class="nav-link text-danger" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </li>

    </ul>
</div>


<!-- MAIN -->
<div class="main">

    <div class="card p-4">

        <h2 class="mb-4">
            📄 My Reports
        </h2>

        <!-- CREATE REPORT -->
        <div class="card p-4 mb-4">

            <h4 class="mb-3">
                Create New Report
            </h4>

            <input
                type="text"
                id="reportTitle"
                class="form-control mb-3"
                placeholder="Report Title"
            >

            <select id="reportType" class="form-select mb-3">
                <option value="Crop Yield Prediction">
                    Crop Yield Prediction
                </option>
                <option value="Farm Report">
                    Farm Report
                </option>
                <option value="Season Report">
                    Season Report
                </option>
            </select>

            <textarea
                id="reportDescription"
                class="form-control mb-3"
                rows="4"
                placeholder="Report Description"
            ></textarea>

            <button
                class="btn btn-success"
                id="createReportBtn"
            >
                <i class="bi bi-plus-circle"></i>
                Create Report
            </button>

        </div>


        <!-- REPORT LIST -->
        <h4 class="mb-3">
            Previous Reports
        </h4>

        <div class="table-responsive">

            <table class="table table-dark table-hover">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="reportTable">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";


// ==================================================
// LOAD REPORTS
// ==================================================

async function loadReports() {

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
        return;
    }

    try {

        const response = await fetch(API_URL + "/reports", {

            method: "GET",

            headers: {
                "Authorization": "Bearer " + token
            }

        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Unable to load reports");
            return;
        }

        const table = document.getElementById("reportTable");

        table.innerHTML = "";

        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center">
                        No reports found
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(report => {

            table.innerHTML += `

                <tr>

                    <td>${report.id}</td>

                    <td>${report.report_title}</td>

                    <td>${report.report_type || "-"}</td>

                    <td>${report.report_description || "-"}</td>

                    <td>
                        ${report.created_at
                            ? new Date(report.created_at).toLocaleDateString()
                            : "-"
                        }
                    </td>

                    <td>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteReport(${report.id})"
                        >
                            <i class="bi bi-trash"></i>
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        });

    }

    catch(error) {

        console.log(error);

        alert("Cannot connect to FastAPI Server");

    }

}



// ==================================================
// CREATE REPORT
// ==================================================

document.getElementById("createReportBtn")
.addEventListener("click", async function() {

    const token = localStorage.getItem("token");

    const title =
        document.getElementById("reportTitle").value.trim();

    const type =
        document.getElementById("reportType").value;

    const description =
        document.getElementById("reportDescription").value.trim();


    if (!title) {

        alert("Please enter report title");

        return;

    }


    try {

        const response = await fetch(API_URL + "/reports", {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                "Authorization": "Bearer " + token

            },

            body: JSON.stringify({

                report_title: title,

                report_type: type,

                report_description: description,

                file_path: null,

                prediction_history_id: null

            })

        });


        const result = await response.json();


        if (response.ok) {

            alert("Report Created Successfully ✅");

            document.getElementById("reportTitle").value = "";

            document.getElementById("reportDescription").value = "";

            loadReports();

        }

        else {

            alert(result.detail || "Failed to create report");

        }

    }

    catch(error) {

        console.log(error);

        alert("Cannot connect to FastAPI Server");

    }

});



// ==================================================
// DELETE REPORT
// ==================================================

async function deleteReport(reportId) {

    if (!confirm("Are you sure you want to delete this report?")) {
        return;
    }

    const token = localStorage.getItem("token");


    try {

        const response = await fetch(
            API_URL + "/reports/" + reportId,
            {

                method: "DELETE",

                headers: {

                    "Authorization": "Bearer " + token

                }

            }
        );


        const result = await response.json();


        if (response.ok) {

            alert("Report Deleted Successfully ✅");

            loadReports();

        }

        else {

            alert(result.detail || "Delete failed");

        }

    }

    catch(error) {

        console.log(error);

        alert("Cannot connect to FastAPI Server");

    }

}



// ==================================================
// LOGOUT
// ==================================================

document.getElementById("logoutBtn")
.addEventListener("click", function(e) {

    e.preventDefault();

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";

});


// ==================================================
// RUN
// ==================================================

loadReports();

</script>

</body>
</html>
