<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction History | Crop AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            background: #020617;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #0f172a;
            padding: 30px;
        }

        .main {
            margin-left: 260px;
            padding: 40px;
        }

        .card {
            border-radius: 12px;
        }

    </style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <h2 class="text-center text-light mb-5">
        🌾 Crop AI
    </h2>

    <ul class="nav flex-column">

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html"
               class="nav-link text-light">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html"
               class="nav-link text-light">
                <i class="bi bi-graph-up-arrow"></i>
                Predict Crop
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="prediction_history.html"
               class="nav-link text-light">
                <i class="bi bi-clock-history"></i>
                Prediction History
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="reports.html"
               class="nav-link text-light">
                <i class="bi bi-file-earmark-text"></i>
                Reports
            </a>
        </li>

        <li class="nav-item mb-3">
            <a href="farmer_dashboard.html"
               class="nav-link text-light">
                <i class="bi bi-person-circle"></i>
                Profile
            </a>
        </li>

        <li class="nav-item mt-5">

            <a href="#"
               class="nav-link text-danger"
               id="logoutBtn">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </a>

        </li>

    </ul>

</div>


<!-- Main Content -->

<div class="main">

    <div class="card p-4">

        <h2 class="mb-4">
            📊 My Prediction History
        </h2>

        <div class="table-responsive">

            <table class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>Date</th>
                        <th>Crop</th>
                        <th>Season</th>
                        <th>State</th>
                        <th>Area</th>
                        <th>Rainfall</th>
                        <th>Temperature</th>
                        <th>Predicted Yield</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="historyTable">

                    <tr>

                        <td colspan="9"
                            class="text-center">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";


async function loadHistory() {

    const token = localStorage.getItem("token");

    if (!token) {

        window.location.href = "login.html";

        return;

    }

    try {

        const response = await fetch(
            API_URL + "/my-predictions",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );


        const data = await response.json();

        const table =
            document.getElementById("historyTable");

        table.innerHTML = "";


        if (!response.ok) {

            table.innerHTML = `
                <tr>
                    <td colspan="9"
                        class="text-center text-danger">
                        ${data.detail || "Unable to load predictions"}
                    </td>
                </tr>
            `;

            return;

        }


        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="9"
                        class="text-center">
                        No prediction history found.
                    </td>
                </tr>
            `;

            return;

        }


        data.forEach(item => {

            table.innerHTML += `

                <tr>

                    <td>
                        ${new Date(item.created_at)
                            .toLocaleDateString()}
                    </td>

                    <td>
                        ${item.crop || "-"}
                    </td>

                    <td>
                        ${item.season || "-"}
                    </td>

                    <td>
                        ${item.state || "-"}
                    </td>

                    <td>
                        ${item.area || "-"}
                    </td>

                    <td>
                        ${item.rainfall || "-"}
                    </td>

                    <td>
                        ${item.temperature || "-"}
                    </td>

                    <td>
                        ${item.predicted_yield || "-"}
                        Ton/Ha
                    </td>

                    <td>

                        <span class="badge bg-success">
                            ${item.prediction_status || "Completed"}
                        </span>

                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.log(error);

        document.getElementById("historyTable").innerHTML = `

            <tr>

                <td colspan="9"
                    class="text-center text-danger">

                    Cannot connect to FastAPI Server

                </td>

            </tr>

        `;

    }

}


// Logout

document.getElementById("logoutBtn")
.addEventListener("click", function(e) {

    e.preventDefault();

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";

});


loadHistory();

</script>

</body>

</html>
