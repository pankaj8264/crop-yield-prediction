<!-- ===========================================================
     Crop Yield Prediction System

     File Name : register.html

     Description:
     This page allows a new farmer to create an account.
     The user enters personal details and farm information.
     After clicking Register, the data is sent to the
     FastAPI backend for account creation.

     Technologies Used:
     • HTML5
     • CSS3
     • Bootstrap 5
     • JavaScript
     • FastAPI REST API
     • JWT Authentication

     Developed By:
     Pankaj

     =========================================================== -->
     <!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>Farmer Registration | Crop Yield Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ==================================================
                Global Theme Colors
================================================== */

:root{

--primary:#22C55E;
--secondary:#16A34A;
--dark:#0F172A;
--card:#1E293B;
--background:#020617;
--text:#F8FAFC;
--gray:#94A3B8;

}

/* ==================================================
                Reset Default Styles
================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

/* ==================================================
                Body Styling
================================================== */

body{

background:linear-gradient(rgba(2,6,23,.85),rgba(2,6,23,.9)),
url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=1600");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:40px;

}

/* ==================================================
                Registration Card
================================================== */

.register-box{

width:500px;

background:rgba(30,41,59,.92);

padding:40px;

border-radius:20px;

backdrop-filter:blur(15px);

box-shadow:0 0 30px rgba(34,197,94,.3);

}
/* ==================================================
                Registration Heading
================================================== */

.register-box h2{

color:var(--text);

font-weight:600;

}

/* ==================================================
                Input Fields
================================================== */

.form-control{

background:#0F172A;

border:1px solid #334155;

color:white;

padding:12px;

}

.form-control::placeholder{

color:#94A3B8;

}

.form-control:focus{

background:#0F172A;

color:white;

border-color:var(--primary);

box-shadow:0 0 10px rgba(34,197,94,.4);

}

/* ==================================================
                Register Button
================================================== */

.btn-success{

background:var(--primary);

border:none;

padding:12px;

font-size:18px;

font-weight:600;

border-radius:10px;

transition:.3s;

}

.btn-success:hover{

background:var(--secondary);

transform:translateY(-2px);

}

/* ==================================================
                Login Link
================================================== */

a{

color:var(--primary);

text-decoration:none;

}

a:hover{

color:#38BDF8;

}

</style>

</head>

<body>
    <!-- ==================================================
                Registration Card
================================================== -->

<div class="register-box">

    <!-- Page Heading -->
    <h2 class="text-center text-light mb-4">
        🌾 Farmer Registration
    </h2>

    <!-- Registration Form -->
    <form id="registerForm">

        <!-- Full Name -->
        <div class="mb-3">
            <label class="form-label text-light">Full Name</label>
            <input
                type="text"
                id="fullname"
                class="form-control"
                placeholder="Enter your full name"
                required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label text-light">Email Address</label>
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label text-light">Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Create password"
                required>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label class="form-label text-light">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm password"
                required>
        </div>

        <!-- Farm Name -->
        <div class="mb-3">
            <label class="form-label text-light">Farm Name</label>
            <input
                type="text"
                id="farm"
                class="form-control"
                placeholder="Enter farm name">
        </div>

        <!-- Location -->
        <div class="mb-4">
            <label class="form-label text-light">Location</label>
            <input
                type="text"
                id="location"
                class="form-control"
                placeholder="Enter your location">
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn btn-success w-100">
            Register
        </button>

    </form>

    <!-- Login Link -->
    <div class="text-center mt-4">

        Already have an account?

        <a href="login.html">
            Login Here
        </a>

    </div>

</div>
<!-- ==================================================
        Register JavaScript
        Connects Register Form with FastAPI Backend
================================================== -->

<script>

const API_URL = "http://127.0.0.1:8000/register";

document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const fullname = document.getElementById("fullname").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const farm = document.getElementById("farm").value;
    const location = document.getElementById("location").value;

    if(password !== confirmPassword){

        alert("Passwords do not match");
        return;

    }

    const userData = {

        full_name: fullname,
        email: email,
        password: password,
        farm_name: farm,
        location: location

    };

    try{

        const response = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(userData)

        });

        const data = await response.json();

        if(response.ok){

            alert("Registration Successful");

            window.location.href="login.html";

        }

        else{

            alert(data.detail || "Registration Failed");

        }

    }

    catch(error){

        console.log(error);

        alert("Cannot connect to FastAPI Server");

    }

});

</script>
</body>
</html>
