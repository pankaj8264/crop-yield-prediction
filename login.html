<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Farmer Login | Crop Yield Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ===============================
   Color Variables
   Used throughout the project
================================= */

:root{

--primary:#22C55E;
--secondary:#16A34A;
--dark:#0F172A;
--card:#1E293B;
--background:#020617;
--text:#F8FAFC;

}

/* ===============================
   Reset Default Browser Styles
================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* ===============================
   Full Page Background
================================= */

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

/* Farming Background Image */

background:linear-gradient(rgba(2,6,23,.85),rgba(2,6,23,.9)),
url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=1600");

background-size:cover;
background-position:center;

}

/* ===============================
   Login Card Design
================================= */

.login-box{

width:420px;
background:rgba(30,41,59,.92);

padding:40px;

border-radius:20px;

backdrop-filter:blur(15px);

box-shadow:0 0 30px rgba(34,197,94,.3);

}
/* ===============================
   Login Heading
================================= */

.login-box h2{
    color: var(--text);
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
}

/* ===============================
   Input Fields
================================= */

.form-control{
    background:#0F172A;
    border:1px solid #334155;
    color:white;
    padding:12px;
}

.form-control::placeholder{
    color:#94A3B8;
}

.form-control:focus{
    background:#0F172A;
    color:white;
    border-color:var(--primary);
    box-shadow:0 0 10px rgba(34,197,94,.4);
}

/* ===============================
   Login Button
================================= */

.btn-login{
    width:100%;
    background:var(--primary);
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
}

.btn-login:hover{
    background:var(--secondary);
}

/* ===============================
   Register Link
================================= */

a{
    color:var(--primary);
    text-decoration:none;
}

a:hover{
    color:#38BDF8;
}

</style>

</head>
<body>

<!-- =========================================
     Login Card
========================================= -->

<div class="login-box">

    <h2>🌾 Farmer Login</h2>

    <!-- Login Form -->
    <form id="loginForm">

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label text-light">Username</label>
        
<input
    type="text"
    id="email"
    class="form-control"
    placeholder="Enter your username"
    required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label text-light">Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                required>
        </div>

        <!-- Remember Me -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label text-light">
                Remember Me
            </label>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <!-- Register Link -->
    <div class="text-center mt-4">

        Don't have an account?

        <a href="register.html">

            Register Here

        </a>

    </div>

</div>
<!-- =========================================
     Login JavaScript
     Connects Login Form with FastAPI Backend
========================================= -->

<script>

const API_URL = "http://127.0.0.1:8000/login";

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try{

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        const response = await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/x-www-form-urlencoded"
            },

            body:formData

        });

        const data = await response.json();

        if(response.ok){

            const payload = JSON.parse(atob(data.access_token.split(".")[1]));

        localStorage.setItem("token", data.access_token);

        alert("✅ Login Successful");

        if (payload.role === "supervisor") {
         window.location.href = "supervisor_dashboard.html";
        } else {
        window.location.href = "farmer_dashboard.html";
        }
        }

        else{

            alert(data.detail || "Invalid Email or Password");

        }

    }

    catch(error){

        console.log(error);

        alert("Cannot connect to FastAPI Server");

    }

});

</script>

</body>

</html>
